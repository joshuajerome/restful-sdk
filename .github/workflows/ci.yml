name: CI

on:
  push:
    branches:
      - "feat/**"
      - "bug/**"
      - "claude/**"
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - staging
      - integration

jobs:
  # ── Auto-label and assign on PR open ────────────────────────────────────────
  auto-label:
    name: Label & Assign PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'opened'

    permissions:
      pull-requests: write

    steps:
      - name: Apply label and assignee
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          BRANCH="${{ github.head_ref }}"
          AUTHOR="${{ github.event.pull_request.user.login }}"

          gh pr edit "$PR" --repo "${{ github.repository }}" --add-assignee "$AUTHOR"

          if echo "$BRANCH" | grep -qE '^feat/'; then
            LABEL="feature"
            COLOR="0075ca"
            DESC="New feature or capability"
          elif echo "$BRANCH" | grep -qE '^bug/'; then
            LABEL="bugfix"
            COLOR="d73a4a"
            DESC="Bug fix"
          elif echo "$BRANCH" | grep -qE '^docs/'; then
            LABEL="documentation"
            COLOR="006b75"
            DESC="Documentation update"
          elif echo "$BRANCH" | grep -qE '^(gh|claude)/'; then
            LABEL="automation"
            COLOR="e4e669"
            DESC="CI/CD or automation change"
          else
            LABEL="feature"
            COLOR="0075ca"
            DESC="New feature or capability"
          fi

          gh label create "$LABEL" --color "$COLOR" --description "$DESC" \
            --force --repo "${{ github.repository }}" 2>/dev/null || true
          gh pr edit "$PR" --repo "${{ github.repository }}" --add-label "$LABEL"

  # ── Ruff Lint ───────────────────────────────────────────────────────────────
  ruff-lint:
    name: Ruff Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dev dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check .

  # ── Ruff Format ─────────────────────────────────────────────────────────────
  ruff-format:
    name: Ruff Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dev dependencies
        run: uv sync

      - name: Ruff format check
        run: uv run ruff format --check .

  # ── Type Check ──────────────────────────────────────────────────────────────
  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dev dependencies
        run: uv sync

      - name: Type check
        run: uv run ty check

  # ── Unit Tests ──────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dev dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short
