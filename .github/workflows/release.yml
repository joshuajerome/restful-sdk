name: Release

on:
  push:
    branches:
      - "release/**"

jobs:
  # ── Unit Tests ──────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dev dependencies
        run: uv sync

      - name: Run unit tests
        run: uv run pytest tests/ -v --tb=short

  # ── Smoke Test ──────────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build wheel
        run: uv build --wheel

      - name: Smoke-test wheel install
        run: |
          uv venv .wheel-test
          uv pip install --python .wheel-test/bin/python dist/restful_sdk-*.whl
          .wheel-test/bin/python -c "from restful import Client; print('restful import OK')"

  # ── Lint & Format ──────────────────────────────────────────────────────────
  lint:
    name: Ruff Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dev dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  # ── GitHub Release ──────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [unit-tests, smoke-test, lint]

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Extract version from branch name
        id: version
        run: |
          BRANCH="${GITHUB_REF#refs/heads/release/}"
          VERSION="${BRANCH#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build wheel
        run: uv build --wheel

      - name: Publish to PyPI
        run: uv publish dist/restful_sdk-*.whl || echo "Already published (skipping)"
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: restful ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: dist/restful_sdk-*.whl
