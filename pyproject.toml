[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "post-it"
version = "0.1.0"
description = "Ingest API endpoint definitions, generate typed Python modules, make REST calls"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.0",
    "urllib3>=2.0.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
include = ["post_it*"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.15.8",
    "ty>=0.0.26",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
