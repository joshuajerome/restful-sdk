[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "restful"
version = "0.0.1"
description = "REST workflow automation — ingest API endpoint definitions, generate typed Python modules, orchestrate multi-step REST workflows"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.0",
    "urllib3>=2.0.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs<2.0",
    "mkdocs-callouts>=1.14",
]

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
include = ["restful*"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.15.8",
    "ty>=0.0.26",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
